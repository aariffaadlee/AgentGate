name: AgentGate security gates

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agentgate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  backend:
    name: Backend quality and security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install locked backend dependencies
        run: |
          python -m pip install "pip==26.2.1"
          python -m pip install -e "./backend[dev]"
      - name: Scan committed source for common secret shapes
        run: python scripts/check_repository_secrets.py
      - name: Verify formatting and lint
        working-directory: backend
        run: |
          python -m ruff format --check app tests migrations ../demo_agent ../scripts
          python -m ruff check app tests migrations ../demo_agent ../scripts
      - name: Run strict type checking
        working-directory: backend
        run: python -m mypy app ../demo_agent
      - name: Run backend tests and coverage gate
        working-directory: backend
        run: python -m pytest
      - name: Run Python security checks
        working-directory: backend
        run: |
          python -m bandit -q -r app
          python -m pip check
          python -m pip_audit --skip-editable
          python -m compileall -q app ../demo_agent ../scripts
      - name: Run deterministic adversarial evaluation
        run: python scripts/run_evaluation.py --reports "${RUNNER_TEMP}/agentgate-evaluation"

  frontend:
    name: Frontend quality and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
      - name: Install pnpm
        run: npm install --global "pnpm@11.19.0"
      - name: Install locked frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Install browser for end-to-end test
        run: pnpm exec playwright install --with-deps chromium
      - name: Lint, test, and build
        run: |
          pnpm lint
          pnpm test
          pnpm build
          pnpm test:e2e
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  policy:
    name: OPA policy tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install checksum-pinned OPA
        env:
          OPA_SHA256: 9903e5125ac281104f2c4b7371d10cc3b74a98933743fcbfc174f9bf0ab20de8
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/opa \
            https://github.com/open-policy-agent/opa/releases/download/v1.18.2/opa_linux_amd64_static
          echo "${OPA_SHA256}  /tmp/opa" | sha256sum --check --strict
          chmod 0755 /tmp/opa
          /tmp/opa version
      - name: Run Rego tests and coverage threshold
        run: /tmp/opa test policies --coverage --threshold 90

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@0d579ffd059c29b07949a3cce3983f0780820c98 # v4.32.6
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - name: Analyze source
        uses: github/codeql-action/analyze@0d579ffd059c29b07949a3cce3983f0780820c98 # v4.32.6
        with:
          category: /language:${{ matrix.language }}
          upload: ${{ github.event.repository.private && 'never' || 'always' }}

  compose:
    name: Docker Compose startup and persisted evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install demonstration client dependencies
        run: |
          python -m pip install "pip==26.2.1"
          python -m pip install -e ./backend
      - name: Create ephemeral test configuration
        run: |
          python - <<'PY'
          import base64
          import os
          import secrets

          def key():
              return base64.urlsafe_b64encode(secrets.token_bytes(32)).rstrip(b"=").decode()

          password = secrets.token_urlsafe(24)
          values = {
              "POSTGRES_USER": "agentgate",
              "POSTGRES_PASSWORD": password,
              "POSTGRES_DB": "agentgate",
              "AGENTGATE_ENVIRONMENT": "development",
              "AGENTGATE_DATABASE_URL": f"postgresql+asyncpg://agentgate:{password}@postgres:5432/agentgate",
              "AGENTGATE_TOKEN_SIGNING_KEY_B64": key(),
              "AGENTGATE_DATA_ENCRYPTION_KEY_B64": key(),
              "AGENTGATE_AUDIT_HMAC_KEY_B64": key(),
              "AGENTGATE_ADMIN_BOOTSTRAP_SECRET": secrets.token_urlsafe(32),
          }
          with open(".env", "w", encoding="utf-8", newline="\n") as target:
              target.writelines(f"{name}={value}\n" for name, value in values.items())
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8", newline="\n") as target:
              target.write(
                  f"AGENTGATE_ADMIN_BOOTSTRAP_SECRET={values['AGENTGATE_ADMIN_BOOTSTRAP_SECRET']}\n"
              )
          PY
      - name: Validate and build Compose project
        run: |
          docker compose config --quiet
          docker compose build --pull
      - name: Start the complete stack
        run: docker compose up --detach --wait --wait-timeout 180
      - name: Check host-visible health and frontend proxy
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8000/health/ready
          curl --fail --silent --show-error http://127.0.0.1:5173/healthz
          curl --fail --silent --show-error http://127.0.0.1:5173/api/health/ready
      - name: Run and persist the evaluation inside the API container
        run: docker compose exec -T api python /scripts/run_evaluation.py --persist
      - name: Run the proof-bound demonstration client
        run: python scripts/run_demo.py
      - name: Print service logs after failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop ephemeral services
        if: always()
        run: docker compose down --volumes --remove-orphans
